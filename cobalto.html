<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reproductor M3U8 Base</title>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: sans-serif; padding: 20px; margin: 0; }
        
        /* Contenedor básico alineado para la pantalla */
        .player-box { width: 100%; max-width: 720px; margin: 0 auto; }
        video { width: 100%; height: auto; background: #111111; display: block; }
        
        .status-msg { text-align: center; margin-top: 15px; font-style: italic; color: #aaaaaa; font-size: 14px; }
    </style>

    <!-- Enlace de producción oficial compatible con HTTPS (GitHub) y HTTP (Localhost) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>

    <div class="player-box">
        <video id="tv-player" controls="controls" autoplay="autoplay"></video>
        <div id="status" class="status-msg">Inicializando canal multimedia...</div>
    </div>

    <script type="text/javascript">
        // =========================================================================
        // REEMPLAZA ÚNICAMENTE ESTE TEXTO POR TU DIRECCIÓN M3U8 DE PRUEBA:
        // =========================================================================
        var URL_M3U8_REAL = "https://longtailvideo.com";
        // =========================================================================
        
        function arrancarFlujo() {
            var video = document.getElementById("tv-player");
            var status = document.getElementById("status");
            
            if (!video) { return; }

            // PRIORIDAD 1: Entornos de PC de escritorio (Chrome, Firefox, Edge, etc.)
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(URL_M3U8_REAL);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    status.innerHTML = "Estado: Reproducción activa mediante librería HLS.";
                    status.style.color = "#00ff00";
                    video.play();
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        status.innerHTML = "Error: Caída de red o fragmentos M3U8 inválidos.";
                        status.style.color = "#ff3333";
                    }
                });
            } 
            
            // PRIORIDAD 2: Entornos con soporte de hardware directo nativo
            else if (video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = URL_M3U8_REAL;
                
                video.addEventListener('loadedmetadata', function() {
                    status.innerHTML = "Estado: Reproducción activa mediante decodificador nativo.";
                    status.style.color = "#00ff00";
                    video.play();
                });
            } 
            
            // FALLBACK: Sin compatibilidad encontrada
            else {
                status.innerHTML = "Error: Este entorno no soporta flujos HLS/M3U8.";
                status.style.color = "#ff3333";
            }
        }

        // Ejecución limpia del árbol de renderizado de la ventana
        window.onload = arrancarFlujo;
    </script>

</body>
</html>
