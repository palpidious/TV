<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Official API TV Test</title>
    <style>
        body { background-color: #111111; color: #ffffff; text-align: center; font-family: sans-serif; padding-top: 20px; }
        /* Explicit dimensions to ensure the 2014 Opera engine scales the box correctly */
        #player { margin: 0 auto; background-color: #000000; width: 640px; height: 390px; }
    </style>
</head>
<body>

    <h1>Official IFrame API Test</h1>
    
    <!-- The YouTube Player placeholder framework -->
    <div id="player"></div>

    <script type="text/javascript">
        // 1. Automatically injects the secure, official YouTube framework script loader link
        var tag = document.createElement('script');
        tag.src = "https://youtube.com";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 2. Globally scoped player variable layout
        var player;
        
        // This execution sequence triggers automatically once the network assets finish downloading
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '390',
                width: '640',
                videoId: 'M7lc1UVf-VE', // Standard YouTube test video ID
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 1,
                    'controls': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 3. Automatically triggers playback once the communication handshake clears
        function onPlayerReady(event) {
            event.target.playVideo();
        }
    </script>
</body>
</html>
